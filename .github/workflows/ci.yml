name: CI

on:
  push:
    branches: [ main, feature/**, ci/**, recovery/**, "**" ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Linting
        run: pnpm lint
      - name: Run Unit & Smoke Tests
        run: pnpm test
      - name: Build Frontend
        run: pnpm build

  backend-integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ztoolkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install backend dependencies
        run: pnpm --dir backend install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --dir backend prisma:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ztoolkit
      - name: Push Database Schema
        run: pnpm --dir backend prisma:push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ztoolkit
      - name: Start backend
        run: pnpm --dir backend dev &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ztoolkit
      - name: Wait for backend
        run: npx wait-on -t 60000 http://localhost:3000/api/health
      - name: Replay webhook fixtures (idempotency check)
        run: |
          curl -s -X POST http://localhost:3000/api/stripe/webhook \
            -H 'Content-Type: application/json' \
            --data @backend/tests/fixtures/checkout.session.completed.json | jq .
          curl -s -X POST http://localhost:3000/api/stripe/webhook \
            -H 'Content-Type: application/json' \
            --data @backend/tests/fixtures/customer.subscription.created.json | jq .
      - name: Assert subscription read API
        run: |
          sleep 1
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000/api/subscription?email=pro@ci.test")
          if [ "$STATUS" != "200" ]; then echo "subscription API failed"; exit 1; fi

  e2e:
    needs: [lint-and-unit, backend-integrity]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ztoolkit
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install backend dependencies
        run: pnpm --dir backend install --frozen-lockfile
      - name: Generate Prisma & push DB
        run: |
          pnpm --dir backend prisma:generate
          pnpm --dir backend prisma:push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ztoolkit
      - name: Start backend
        run: pnpm --dir backend dev &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ztoolkit
      - name: Build frontend
        run: pnpm build
      - name: Start frontend preview
        run: pnpm preview --port 5173 &
      - name: Wait for services
        run: npx wait-on -t 60000 http://localhost:5173 http://localhost:3000/api/health
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        run: npx playwright test --config=e2e/playwright.config.ts --reporter=dot
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ztoolkit
