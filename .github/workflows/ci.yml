name: CI

on:
  push:
    branches: [ main, feature/**, ci/**, "**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ztoolkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: pnpm install (backend)
        run: pnpm --dir backend install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --dir backend prisma:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ztoolkit
      - name: Run migrations (deploy)
        run: pnpm --dir backend prisma:migrate --preview-feature
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ztoolkit
      - name: Start backend
        run: pnpm --dir backend dev &
      - name: Wait for backend
        run: npx wait-on http://localhost:3000/api/health
      - name: Replay webhook fixtures (idempotency check)
        run: |
          curl -s -X POST http://localhost:3000/api/stripe/webhook \
            -H 'Content-Type: application/json' \
            --data @backend/tests/fixtures/checkout.session.completed.json | jq .
          curl -s -X POST http://localhost:3000/api/stripe/webhook \
            -H 'Content-Type: application/json' \
            --data @backend/tests/fixtures/customer.subscription.created.json | jq .
      - name: Assert subscription read API
        run: |
          sleep 1
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000/api/subscription?email=pro@ci.test")
          if [ "$STATUS" != "200" ]; then echo "subscription API failed"; exit 1; fi

  frontend-and-contract:
    needs: backend-integrity
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test --silent
      - name: Start backend (for contract check)
        run: pnpm --dir backend dev &
      - name: Start frontend (preview)
        run: pnpm build && pnpm preview &
      - name: Wait for services
        run: npx wait-on http://localhost:5173 http://localhost:3000/api/health
      - name: Contract: /api/subscription returns 200
        run: |
          curl -sSf "http://localhost:3000/api/subscription?email=pro@ci.test" | jq .

  e2e:
    needs: frontend-and-contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ztoolkit
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Start backend + migrate
        run: |
          pnpm --dir backend prisma:generate
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ztoolkit pnpm --dir backend prisma:migrate --preview-feature
          pnpm --dir backend dev &
      - name: Start frontend
        run: pnpm build && pnpm preview &
      - name: Wait for services
        run: npx wait-on http://localhost:5173 http://localhost:3000/api/health
      - name: Run Playwright E2E
        uses: microsoft/playwright-github-action@v1
        with:
          run: npx playwright test --config=e2e/playwright.config.ts --reporter=dot
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ztoolkit
